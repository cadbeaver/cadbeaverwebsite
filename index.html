<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>" />
    <meta name="viewport" content="width=768, user-scalable=yes" />
    <script>
        (function() {
            function syncViewport() {
                var meta = document.querySelector('meta[name="viewport"]');
                if (!meta) {
                    meta = document.createElement('meta');
                    meta.name = 'viewport';
                    document.head.appendChild(meta);
                }
                var screenW = window.screen.width;
                var innerW = window.innerWidth;
                var effectiveW = (screenW > 0 && screenW < 768) ? screenW : (innerW > 0 && innerW < 768 ? innerW : 0);
                if (effectiveW > 0) {
                    var scale = Number((effectiveW / 768).toFixed(4));
                    meta.setAttribute('content', 'width=768, initial-scale=' + scale + ', minimum-scale=' + scale + ', maximum-scale=3.0, user-scalable=yes');
                } else if (screenW >= 768 || innerW >= 768) {
                    meta.setAttribute('content', 'width=device-width, initial-scale=1.0');
                }
            }
            syncViewport();
            window.addEventListener('resize', syncViewport);
            window.addEventListener('orientationchange', syncViewport);
        })();
    </script>
    <title>Cadbeaver — Advanced Mechanical Design & Engineering Solutions</title>
